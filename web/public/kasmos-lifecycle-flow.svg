<!-- source: web/public/kasmos-lifecycle-flow.svg; keep in sync with web/docs/static/img/kasmos-lifecycle-flow.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 480" role="img"
     aria-labelledby="kl-title kl-desc">
  <title id="kl-title">kasmos lifecycle flow</title>
  <desc id="kl-desc">planner and architect baseline run in parallel, then architect merge, coder waves, reviewer and fixer loop, master readiness, and done.</desc>

  <defs>
    <!-- arrowhead markers — static colors with dark-mode CSS override for reliability -->
    <marker id="am"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="am"/>
    </marker>
    <marker id="amf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="amf"/>
    </marker>
    <marker id="amr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="amr"/>
    </marker>
  </defs>

  <style>
    /* ── design tokens ── */
    svg {
      --ink:    #1a1a2e;
      --muted:  #6b7280;
      --surface:#f0f2fa;
      --bg:     #ffffff;
      --gold:   #b45309;
      --iris:   #4f46e5;
      --foam:   #0891b2;
      --rose:   #be123c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:    #e2e4f0;
        --muted:  #9ca3af;
        --surface:#1e1f2e;
        --bg:     #13141f;
        --gold:   #fbbf24;
        --iris:   #818cf8;
        --foam:   #22d3ee;
        --rose:   #fb7185;
      }
    }

    /* ── base ── */
    text { font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
    .bg  { fill: var(--bg); }

    /* ── node fills (light) — overridden in dark ── */
    .ni  { fill: #eef0fd; stroke: #4f46e5; stroke-width: 1.5; }
    .nf  { fill: #ecfbfd; stroke: #0891b2; stroke-width: 1.5; }
    .ng  { fill: #fef9ec; stroke: #b45309; stroke-width: 1.5; }
    .nr  { fill: #fef0f2; stroke: #be123c; stroke-width: 1.5; }
    .node-done  { fill: #eef0fd; stroke: #4f46e5; stroke-width: 2.5; }
    @media (prefers-color-scheme: dark) {
      .ni  { fill: #1d1e42; stroke: #818cf8; }
      .nf  { fill: #0f2535; stroke: #22d3ee; }
      .ng  { fill: #241e08; stroke: #fbbf24; }
      .nr  { fill: #2a1020; stroke: #fb7185; }
      .node-done  { fill: #1d1e42; stroke: #818cf8; }
    }

    /* ── cluster outlines ── */
    .gg  { fill: none; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 7,4; }
    .gi  { fill: none; stroke: #4f46e5; stroke-width: 1.5; stroke-dasharray: 7,4; }
    @media (prefers-color-scheme: dark) {
      .gg  { stroke: #fbbf24; }
      .gi  { stroke: #818cf8; }
    }

    /* ── text ── */
    .tl  { font-size: 13px; fill: var(--ink);   text-anchor: middle; dominant-baseline: central; }
    .ts  { font-size: 10px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
    .tg  { font-size: 11px; fill: var(--muted); dominant-baseline: auto; }
    .sig { font-size:  9px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
    .td  { font-size: 13px; fill: var(--iris);  text-anchor: middle; dominant-baseline: central; font-weight: 700; }
    .sig-r { font-size: 9px; fill: #be123c; dominant-baseline: central; }
    @media (prefers-color-scheme: dark) { .sig-r { fill: #fb7185; } }

    /* ── edges ── */
    .e   { fill: none; stroke: var(--muted); stroke-width: 1.5; marker-end: url(#am);  }
    .ef  { fill: none; stroke: #0891b2;      stroke-width: 1.5; marker-end: url(#amf); }
    .er  { fill: none; stroke: #be123c;      stroke-width: 1.5; marker-end: url(#amr); }
    @media (prefers-color-scheme: dark) {
      .ef  { stroke: #22d3ee; }
      .er  { stroke: #fb7185; }
    }

    /* ── arrowhead fills ── */
    .am  { fill: #6b7280; }
    .amf { fill: #0891b2; }
    .amr { fill: #be123c; }
    @media (prefers-color-scheme: dark) {
      .am  { fill: #9ca3af; }
      .amf { fill: #22d3ee; }
      .amr { fill: #fb7185; }
    }

    /* ── advisory badge ── */
    .ba  { fill: #0891b2; }
    .bt  { font-size: 8px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; font-family: ui-monospace, monospace; }
    @media (prefers-color-scheme: dark) {
      .ba  { fill: #22d3ee; }
      .bt  { fill: #13141f; }
    }

    /* ── flow animation ── */
    @keyframes fd { to { stroke-dashoffset: -20; } }

    @media (prefers-reduced-motion: no-preference) {
      .ea {
        stroke-dasharray: 8, 4;
        stroke-dashoffset: 0;
        animation: fd 1.5s linear infinite;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ea {
        animation: none !important;
        stroke-dasharray: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

  <!-- ── background ── -->
  <rect width="1260" height="480" class="bg"/>

  <!-- ════════════════════════════════════════════════════════
       ZONE 1 — plan_start group (dashed, gold)
  ════════════════════════════════════════════════════════ -->
  <rect x="14" y="52" width="218" height="336" rx="12" class="gg"/>
  <text x="22" y="44" class="tg">plan_start</text>

  <!-- planner node -->
  <rect x="28" y="106" width="190" height="52" rx="8" class="ni"/>
  <text x="123" y="132" class="tl">planner</text>

  <!-- dashed lane divider -->
  <line x1="123" y1="159" x2="123" y2="272"
        stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,5"/>

  <!-- baseline node + advisory badge -->
  <rect x="28" y="274" width="190" height="52" rx="8" class="nf"/>
  <text x="108" y="300" class="tl">baseline</text>
  <rect x="147" y="291" width="54" height="16" rx="4" class="ba"/>
  <text x="174" y="299" class="bt">advisory</text>

  <!-- elaborator_finished label inside plan_start -->
  <text x="123" y="370" class="sig">elaborator_finished</text>

  <!-- ── planner → architect merge ── -->
  <path d="M232,132 C252,132 258,240 264,240" class="e ea"/>
  <text x="250" y="161" class="sig" transform="rotate(-44 250 161)">planner_finished</text>

  <!-- ── baseline → architect merge ── -->
  <path d="M232,300 C252,300 258,246 264,244" class="e"/>

  <!-- ════════════════════════════════════════════════════════
       ZONE 2 — architect merge
  ════════════════════════════════════════════════════════ -->
  <rect x="266" y="214" width="152" height="52" rx="8" class="ng"/>
  <text x="342" y="240" class="tl">architect merge</text>

  <!-- ── architect merge → waves ── -->
  <line x1="420" y1="240" x2="444" y2="240" class="e ea"/>

  <!-- ════════════════════════════════════════════════════════
       ZONE 3 — waves group (dashed, iris)
  ════════════════════════════════════════════════════════ -->
  <rect x="446" y="52" width="214" height="336" rx="12" class="gi"/>
  <text x="454" y="44" class="tg">waves</text>

  <!-- wave 1 -->
  <text x="553" y="88" class="ts">wave 1</text>
  <rect x="458" y="98"  width="91" height="42" rx="7" class="ni"/>
  <text x="503" y="119" class="tl" style="font-size:11px">coder</text>
  <rect x="557" y="98"  width="91" height="42" rx="7" class="ni"/>
  <text x="602" y="119" class="tl" style="font-size:11px">coder</text>

  <!-- wave 2 -->
  <text x="553" y="160" class="ts">wave 2</text>
  <rect x="458" y="169" width="91" height="42" rx="7" class="ni"/>
  <text x="503" y="190" class="tl" style="font-size:11px">coder</text>
  <rect x="557" y="169" width="91" height="42" rx="7" class="ni"/>
  <text x="602" y="190" class="tl" style="font-size:11px">coder</text>

  <!-- more waves indicator -->
  <text x="553" y="300" class="ts" style="font-size:24px">…</text>

  <!-- ── waves → reviewer ── -->
  <path d="M660,240 C678,240 682,165 692,165" class="e ea"/>

  <!-- ════════════════════════════════════════════════════════
       ZONE 4 — reviewer / fixer loop
  ════════════════════════════════════════════════════════ -->

  <!-- reviewer node -->
  <rect x="694" y="139" width="140" height="52" rx="8" class="nf"/>
  <text x="764" y="165" class="tl">reviewer</text>

  <!-- fixer node -->
  <rect x="694" y="306" width="140" height="52" rx="8" class="nr"/>
  <text x="764" y="332" class="tl">fixer</text>

  <!-- reviewer → fixer (right arc — review_changes_requested) -->
  <path d="M834,165 C874,165 874,332 834,332" class="er"/>
  <text x="879" y="240" class="sig-r" style="text-anchor:start">review_changes</text>
  <text x="879" y="252" class="sig-r" style="text-anchor:start">_requested</text>

  <!-- fixer → reviewer (left arc — back to review) -->
  <path d="M694,332 C654,332 654,165 694,165" class="ef"/>

  <!-- ── reviewer → master (review_approved) ── -->
  <path d="M834,165 C862,165 880,240 896,240" class="e ea"/>
  <text x="868" y="194" class="sig">review_approved</text>

  <!-- ════════════════════════════════════════════════════════
       ZONE 5 — master readiness gate
  ════════════════════════════════════════════════════════ -->
  <rect x="898" y="214" width="140" height="52" rx="8" class="ng"/>
  <text x="968" y="240" class="tl">master</text>

  <!-- ── master → done (verify_approved) ── -->
  <line x1="1040" y1="240" x2="1076" y2="240" class="e ea"/>
  <text x="1057" y="228" class="sig">verify_approved</text>

  <!-- ════════════════════════════════════════════════════════
       ZONE 6 — done
  ════════════════════════════════════════════════════════ -->
  <rect x="1078" y="214" width="100" height="52" rx="8" class="node-done"/>
  <text x="1128" y="240" class="td">done</text>

  <!-- ── verify_failed: master → fixer (bottom arc, dashed rose) ── -->
  <path d="M968,268 C968,422 764,422 764,360"
        class="er" stroke-dasharray="5,3"/>
  <text x="866" y="436" class="sig-r" style="text-anchor:middle">verify_failed</text>

</svg>
