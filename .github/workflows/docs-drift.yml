name: Docs drift

on:
  pull_request:
    paths:
      - 'cmd/**.go'
      - 'config/**.go'
      - 'daemon/**.go'
      - 'internal/**.go'
      - 'orchestration/**.go'
      - 'web/docs/docs/**'
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.drift.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: drift
        env:
          # For pull_request events, compare against the PR base so only the
          # PR's own changes are evaluated, not unrelated drift from earlier merges.
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          REPORT=$(bash scripts/detect-docs-drift.sh)
          {
            echo "report<<EOF"
            echo "$REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  pr-check:
    if: github.event_name == 'pull_request'
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.detect.outputs.report }}
        with:
          script: |
            const report = JSON.parse(process.env.REPORT || '{"drift":[]}');
            if (!report.drift.length) return;

            const marker = "<!-- docs-drift-report -->";
            const body = `${marker}
            ## docs drift detected

            The following code changes don't have matching doc updates:

            \`\`\`json
            ${JSON.stringify(report, null, 2)}
            \`\`\`

            bypass: see scripts/git-hooks/README.md`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

            core.setFailed("docs drift detected");

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hook unit scenarios
        run: bash scripts/git-hooks/test/run.sh

      - name: Run hook smoke harness
        run: bash scripts/git-hooks/test/smoke.sh
