# Generated by kas setup

daemon_poll_interval = 0

[phases]
  elaborating = "architect"
  fixer = "fixer"
  implementing = "coder"
  planning = "planner"
  quality_review = "reviewer"
  readiness_review = "master"
  spec_review = "reviewer"

[agents]
[agents.architect]
enabled = true
program = "opencode"
model = "openai/gpt-5.4"
temperature = 0.2
effort = "xhigh"
[agents.chat]
enabled = true
program = "opencode"
model = "openai/gpt-5.4"
temperature = 0.3
effort = "medium"
[agents.coder]
enabled = true
program = "claude"
model = "claude-sonnet-4-6"
temperature = 0.1
flags = ["--permission-mode bypassPermissions"]
effort = "medium"
[agents.fixer]
enabled = true
program = "claude"
model = "claude-opus-4-6"
temperature = 0.1
effort = "high"
flags = ["--permission-mode bypassPermissions"]
[agents.master]
enabled = true
program = "opencode"
model = "openai/gpt-5.4"
temperature = 0.2
effort = "high"
[agents.planner]
enabled = true
program = "claude"
model = "claude-opus-4-6"
temperature = 0.3
effort = "high"
[agents.reviewer]
enabled = true
program = "claude"
model = "claude-sonnet-4-6"
flags = ["--permission-mode bypassPermissions"]
temperature = 0.2
effort = "medium"

[ui]
  animate_banner = false
  auto_advance_waves = true
  auto_advance = true
  auto_review_fix = true
  auto_readiness_review = true

[telemetry]

[orchestration]
