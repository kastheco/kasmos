# Generated by kas setup

daemon_poll_interval = 1000
auto_yes = true

[enforcement]
codex = false

[phases]
  elaborating = "architect"
  fixer = "fixer"
  implementing = "coder"
  planning = "planner"
  quality_review = "reviewer"
  readiness_review = "master"
  spec_review = "reviewer"

[agents]
  [agents.architect]
    enabled = true
    program = "claude"
    model = "claude-opus-4-8"
    execution_mode = "tmux"
    flags = ["--permission-mode bypassPermissions"]
    temperature = 0.2
    effort = "xhigh"
  [agents.chat]
    enabled = true
    program = "codex"
    model = "gpt-5.6-sol"
    execution_mode = "sdk"
    tier = "fast"
    temperature = 0.3
    effort = "low"
  [agents.coder]
    enabled = true
    temperature = 0.1
    program = "codex"
    model = "gpt-5.6-sol"
    execution_mode = "sdk"
    tier = "fast"
    effort = "low"
  [agents.fixer]
    enabled = true
    program = "codex"
    model = "gpt-5.6-sol"
    execution_mode = "sdk"
    tier = "fast"
    temperature = 0.1
    effort = "medium"
  [agents.master]
    enabled = true
    program = "codex"
    model = "gpt-5.6-sol"
    execution_mode = "sdk"
    tier = "fast"
    temperature = 0.2
    effort = "high"
  [agents.planner_opus]
    enabled = true
    program = "claude"
    model = "claude-opus-4-8"
    execution_mode = "tmux"
    flags = ["--permission-mode bypassPermissions"]
    temperature = 0.3
    effort = "xhigh"
  [agents.planner_gpt]
    enabled = true
    program = "codex"
    model = "gpt-5.6-sol"
    execution_mode = "sdk"
    temperature = 0.3
    effort = "high"
    tier = "fast"
  [agents.reviewer]
    enabled = true
    program = "codex"
    model = "gpt-5.6-sol"
    execution_mode = "sdk"
    tier = "fast"
    temperature = 0.2
    effort = "medium"

[ui]
  animate_banner = false
  auto_advance_waves = true
  auto_advance = true
  auto_review_fix = true
  max_review_fix_cycles = 3
  auto_readiness_review = true
  readiness_self_fix_max_lines = 80
  readiness_max_verify_cycles = 3
  theme_source = "system"
  system_theme_provider = "caelestia"
  theme_palette_file = "/home/kas/.config/caelestia/kasmos-theme.json"
[telemetry]

[orchestration]
blueprint_skip_threshold = 1
planners = ["planner_opus", "planner_gpt"]

[keybinds]
