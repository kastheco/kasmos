# Generated by kas setup

daemon_poll_interval = 0
auto_yes = true

[enforcement]
codex = false

[phases]
  elaborating = "architect"
  fixer = "fixer"
  implementing = "coder"
  planning = "planner"
  quality_review = "reviewer"
  readiness_review = "master"
  spec_review = "reviewer"

[agents]
  [agents.architect]
    enabled = true
    program = "claude"
    model = "claude-opus-4-8"
    execution_mode = "tmux"
    flags = ["--permission-mode bypassPermissions"]
    tier = "fast"
    temperature = 0.2
    effort = "xhigh"
  [agents.chat]
    enabled = true
    program = "codex"
    model = "gpt-5.5"
    execution_mode = "tmux"
    tier = "fast"
    temperature = 0.3
    effort = "medium"
  [agents.coder]
    enabled = true
    temperature = 0.1
    program = "codex"
    model = "gpt-5.5"
    tier = "fast"
    effort = "low"
  [agents.fixer]
    enabled = true
    program = "codex"
    model = "gpt-5.5"
    temperature = 0.1
    effort = "high"
  [agents.master]
    enabled = true
    program = "codex"
    model = "gpt-5.5"
    execution_mode = "tmux"
    tier = "fast"
    temperature = 0.2
    effort = "xhigh"
  [agents.planner_opus]
    enabled = true
    program = "claude"
    model = "claude-opus-4-8"
    execution_mode = "tmux"
    flags = ["--permission-mode bypassPermissions"]
    temperature = 0.3
    effort = "xhigh"
  [agents.planner_gpt]
    enabled = true
    program = "codex"
    model = "gpt-5.5"
    execution_mode = "tmux"
    temperature = 0.3
    effort = "xhigh"
    tier = "fast"
  [agents.reviewer]
    enabled = true
    program = "claude"
    model = "claude-sonnet-4-6"
    temperature = 0.2
    effort = "medium"
    flags = ["--permission-mode bypassPermissions"]

[ui]
  animate_banner = false
  auto_advance_waves = true
  auto_advance = true
  auto_review_fix = true
  auto_readiness_review = true
  theme_source = "system"
  system_theme_provider = "caelestia"
  theme_palette_file = "/home/kas/.config/caelestia/kasmos-theme.json"
[telemetry]

[orchestration]
planners = ["planner_opus", "planner_gpt"]

[keybinds]
